name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vazhisync
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Throwaway CI-only values; nothing here is a real secret.
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/vazhisync_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      REQUIRE_SERVICES: "1"  # fail instead of skipping when Postgres/Redis are missing

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Service containers can't be built from a Dockerfile: add pgvector (B22) the same way
      # backend/docker/postgres/Dockerfile does.
      - name: Add pgvector to the Postgres service
        working-directory: .
        env:
          PGDG_FIX: >-
            sed -i 's#http://apt.postgresql.org/pub/repos/apt#http://apt-archive.postgresql.org/pub/repos/apt#'
            /etc/apt/sources.list.d/pgdg.list
        run: >-
          docker exec ${{ job.services.postgres.id }} sh -c
          "$PGDG_FIX && apt-get update -qq
          && apt-get install -y -qq --no-install-recommends postgresql-17-pgvector"

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/vazhisync
        run: uv run alembic upgrade head && uv run alembic check

      - name: Tests (unit + Postgres/Redis; full-stack tests excluded)
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

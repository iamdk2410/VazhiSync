name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vazhisync
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Throwaway CI-only values; nothing here is a real secret.
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/vazhisync_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      REQUIRE_SERVICES: "1"  # fail instead of skipping when Postgres/Redis are missing

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/vazhisync
        run: uv run alembic upgrade head && uv run alembic check

      - name: Tests (unit + Postgres/Redis; full-stack tests excluded)
        run: uv run pytest

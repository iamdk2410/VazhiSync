[project]
name = "vazhisync-backend"
version = "0.1.0"
description = "VazhiSync — bus bunching control advisor (API, agents, simulator, MCP servers)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "geoalchemy2>=0.21.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "mcp>=2.3.0",
    "psycopg[binary,pool]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fixed test credentials

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Generated migrations call geoalchemy2's op.* extensions, which only exist at runtime.
exclude = ["^\\.venv/", "app[/\\\\]db[/\\\\]migrations[/\\\\]versions[/\\\\]"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# `stack` tests need the full compose stack: run them with `uv run pytest -m stack`.
# `services` tests need Postgres + Redis; they skip if unreachable (CI sets REQUIRE_SERVICES=1).
addopts = "-m 'not stack and not ollama'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "stack: needs the full docker compose stack running (not run in CI)",
    "services: needs Postgres + Redis (uses a separate *_test database)",
    "ollama: calls the real local LLM (Ollama + qwen3:8b on the host; not run in CI)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
